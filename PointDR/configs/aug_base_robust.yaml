data:
  num_classes: 19
  ignore_label: 255
  training_size: 19132

model:
  name: minkunet_robust
  cr: 0.5
  lambda_gsp: 0.05
  lambda_cl: 0.1
  things_class_ids: [ 0, 1, 2, 3, 4, 5, 6, 7, 13, 17, 18 ]
  things_weights: 5.0
  stuff_weights: 1.0

train:
  seed: 1588147245
  deterministic: False

src_dataset:
  name: semanticAugkitti
  root: /home/dataset/SemanticKITTI/sequences
  num_points: 80000
  voxel_size: 0.05

  # --- Weak Aug 流程 ---
  weak_aug:
    - name: rotate_scale         # 旋转和缩放
      prob: 1.0
      min_angle: 0.0
      max_angle: 6.283185 # 2 * pi
      min_scale: 0.95
      max_scale: 1.05


  # --- 定义 Strong Aug 流程---
  strong_aug:
    - name: rotate_scale
      prob: 1.0
      min_angle: 0.0
      max_angle: 6.283185 # 2 * pi
      min_scale: 0.95
      max_scale: 1.05

    - name: flip_axis
      prob: 1.0
      prob_x: 0.5
      prob_y: 0.5

    # --- 物理衰减模型 (PMA) ---
    - name: physical_attenuation_model
      prob: 0.8
      alpha_min: 0.005 # 薄雾
      alpha_max: 0.1  # 浓雾/暴雪

    # 选择性几何抖动 (SJ) ---
    - name: selective_range_jittering
      prob: 0.8  # SOTA DSJ/ASJ 的概率是 0.5
      mode_prob_angle: 0.5
      jitter_base_std: 0.01
      jitter_dist_factor: 0.0005
      clip_range: [-0.05, 0.05]

    # 强度通道扰动 (ICD) ---
    - name: intensity_channel_distortion
      prob: 0.7
      gamma_prob: 0.5
      gamma_min: 0.7
      gamma_max: 1.3

    - name: add_noise_points
      prob: 0.3
      min_num: 100
      max_num: 1000
      intensity_scale: 0.1


#tgt_dataset:
#  name: semantickitti
#  root: /home/dataset/SemanticKITTI/sequences
#  num_points: 80000
#  voxel_size: 0.05

tgt_dataset:
  name: semanticstf
  root: /home/dataset/SemanticSTF
  num_points: 80000
  voxel_size: 0.05

num_epochs: 50
batch_size: 8

criterion:
  name: cross_entropy
  ignore_index: 255

optimizer:
  name: sgd
  lr: 2.4e-1
  weight_decay: 1.0e-4
  momentum: 0.9
  nesterov: true

scheduler:
  name: cosine_warmup

workers_per_gpu: 8
distributed: False
amp_enabled: True

