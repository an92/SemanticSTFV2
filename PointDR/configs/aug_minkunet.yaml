data:
  num_classes: 19
  ignore_label: 255
  training_size: 19132

model:
  name: raw_minkunet
  cr: 0.5

train:
  seed: 1588147245
  deterministic: False

src_dataset:
  name: semanticAugSinglekitti
  root: /home/dataset/SemanticKITTI/sequences
  num_points: 80000
  voxel_size: 0.05

  # --- 定义 Aug 流程---
  strong_aug:
    - name: rotate_scale
      prob: 1.0
      min_angle: 0.0
      max_angle: 6.283185 # 2 * pi
      min_scale: 0.95
      max_scale: 1.05

    - name: flip_axis
      prob: 1.0
      prob_x: 0.5
      prob_y: 0.5

    - name: semantic_targeted_point_drop  # CL-RA: 核心点丢失
      prob: 1.0
      thing_class_ids: [ 0,1,2,3,4, 5,6,7,13,17,18 ]
      max_drop_prob_stuff: 0.4
      max_drop_prob_things: 0.005

    - name: add_random_noise_points
      prob: 1.0
      min_num: 0
      max_num: 2000
      intensity_scale: 0.5
        
#    - name: controlled_structure_jittering  # CL-RA: 核心结构抖动
#      prob: 1.0
#      k_neighbors: 15
#      sigma_flat: 0.001
#      edge_factor: 2.0
#      curvature_threshold: 0.1

tgt_dataset:
  name: semantickitti
  root: /home/dataset/SemanticKITTI/sequences
  num_points: 80000
  voxel_size: 0.05

num_epochs: 30
batch_size: 8

criterion:
  name: cross_entropy
  ignore_index: 255

optimizer:
  name: sgd
  lr: 2.4e-1
  weight_decay: 1.0e-4
  momentum: 0.9
  nesterov: true

scheduler:
  name: cosine_warmup

workers_per_gpu: 8
distributed: False
amp_enabled: True

