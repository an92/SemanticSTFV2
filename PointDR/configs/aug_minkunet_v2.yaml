data:
  num_classes: 19
  ignore_label: 255
  training_size: 19132

model:
  name: minkunet_v2
  cr: 0.5
  lambda_repulsion: 0.0  # 排斥项， 移除
  lambda_proto: 0.0  # 移除
  lambda_orth: 0.01  # 强制 Content Feature和 Style Feature互相正交，确保它们捕捉的信息不重叠。
  lambda_style: 0.001   # 对 Style施加 L2 正则化约束，防止其特征值变得过大或过于复杂，有助于整体训练稳定。
  temp_uncertainty: 0.7  # 控制不确定性加权的敏感度。它确保模型主要关注那些它相对确定的点（即不让模型被大量高不确定性的噪声点带偏）。
  disentangle_start_epoch: 5  # Warm-up 机制， 在训练初期（前 5 个 Epoch）只使用Lce
  lambda_aug: 1.0   # 风格监督信号。 强制 Style施加学习到增强信息（即域信息）。


train:
  seed: 1588147245
  deterministic: False

src_dataset:
  name: semanticAugSinglekitti
  root: /home/dataset/SemanticKITTI/sequences
  num_points: 80000
  voxel_size: 0.05

  # --- 定义 Aug 流程---
  strong_aug:
    - name: rotate_scale
      prob: 1.0
      min_angle: 0.0
      max_angle: 6.283185 # 2 * pi
      min_scale: 0.95
      max_scale: 1.05

    - name: flip_axis
      prob: 1.0
      prob_x: 0.5
      prob_y: 0.5

    - name: physical_attenuation_model
      alpha_min: 0.005
      alpha_max: 0.05
      prob: 0.5

    - name: selective_range_jittering
      mode_prob_angle: 0.5
      prob: 0.5
      jitter_dist_factor: 0.0005
      jitter_base_std: 0.01
      clip_range: [-0.05, 0.05]

    - name: intensity_channel_distortion
      prob: 0.7
      gamma_max: 1.3
      gamma_min: 0.7
      gamma_prob: 0.5

    - name: random_general_jittering
      prob: 0.2
      scale: 0.005
      max_clip: 0.01

    - name: distance_biased_point_drop
      prob: 0.2
      base_drop: 0.04
      max_drop: 0.2
      r_scale: 60.0
      gamma: 0.3
      density_voxel_size: 2.0
      protect_small_classes: [0,1,2,3,4,5,6,7, 13, 17, 18 ]
      protect_scale: 0.5

    - name: occlusion_patch
      num_patches: 1
      patch_size: 2.0
      prob: 0.1

#tgt_dataset:
#  name: semantickitti
#  root: /home/dataset/SemanticKITTI/sequences
#  num_points: 80000
#  voxel_size: 0.05

tgt_dataset:
  name: semanticstf
  root: /home/dataset/SemanticSTF
  num_points: 80000
  voxel_size: 0.05

num_epochs: 30
batch_size: 8

criterion:
  name: cross_entropy
  ignore_index: 255

optimizer:
  name: sgd
  lr: 2.4e-1
  weight_decay: 1.0e-4
  momentum: 0.9
  nesterov: true

scheduler:
  name: cosine_warmup

workers_per_gpu: 8
distributed: False
amp_enabled: True

