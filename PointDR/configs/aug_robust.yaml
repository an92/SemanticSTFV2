data:
  num_classes: 19
  ignore_label: 255
  training_size: 19132

model:
  name: minkunet_dr
  cr: 0.5
  lamda_CL: 0.1   # # PointDR 对比损失权重
  lamda_SCRL: 0.05  # SCRL 损失权重
  lamda_FeatConsist: 0.08  # LDR-FR 损失权重
  repulsion_margin: 1.0  # SCRL 推远损失的 margin (L2距离)
  thing_class_ids: [ 0, 1, 2, 3, 4, 5, 6, 7, 13, 17, 18 ]

train:
  seed: 1588147245
  deterministic: False

src_dataset:
  name: semanticAugkitti
  root: /home/dataset/SemanticKITTI/sequences
  num_points: 80000
  voxel_size: 0.05

  # --- Weak Aug 流程 ---
  weak_aug:
    - name: rotate_scale         # 旋转和缩放
      prob: 1.0
      min_angle: 0.0
      max_angle: 6.283185 # 2 * pi
      min_scale: 0.95
      max_scale: 1.05


  # --- 定义 Strong Aug 流程---
  strong_aug:
    - name: rotate_scale
      prob: 1.0
      min_angle: 0.0
      max_angle: 6.283185 # 2 * pi
      min_scale: 0.95
      max_scale: 1.05

    - name: flip_axis
      prob: 1.0
      prob_x: 0.5
      prob_y: 0.5

    - name: beamwise_semantic_jitter
      prob: 0.5
      angle_range: [0., 360.]
      sector_size: [30., 60.]
      stuff_jitter_std: [0.02, 0.02, 0.02] # 2cm
      things_jitter_std: [0.10, 0.10, 0.10] # 10cm
      thing_class_ids: [ 0, 1, 2, 3, 4, 5, 6, 7, 13, 17, 18 ]

    - name: beamwise_semantic_drop
      prob: 0.5
      thing_drop_ratio: 0.35
      stuff_drop_ratio: 0.08
      angle_range: [ 0., 360. ]
      sector_size: [ 45., 90. ]
      thing_class_ids: [ 0, 1, 2, 3, 4, 5, 6, 7, 13, 17, 18 ]

    - name: add_random_noise_points
      prob: 1.0
      min_num: 0
      max_num: 2000
      intensity_scale: 0.5


tgt_dataset:
  name: semantickitti
  root: /home/dataset/SemanticKITTI/sequences
  num_points: 80000
  voxel_size: 0.05

num_epochs: 50
batch_size: 8

criterion:
  name: cross_entropy
  ignore_index: 255

optimizer:
  name: sgd
  lr: 2.4e-1
  weight_decay: 1.0e-4
  momentum: 0.9
  nesterov: true

scheduler:
  name: cosine_warmup

workers_per_gpu: 8
distributed: False
amp_enabled: True

