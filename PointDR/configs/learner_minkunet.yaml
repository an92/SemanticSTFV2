model:
  name: minkunet_learner
  cr: 0.5
  lamda_proto: 0.1
  lamda_cons: 0.05
  lamda_info: 0.05
  gamma_acp: 2.0


data:
  num_classes: 19
  ignore_label: 255
  training_size: 19132

train:
  seed: 1588147245
  deterministic: False

src_dataset:
  name: semantic_learner   # pointdr原始的数据处理方式  semantickitti semantic_learner
  root: /home/dataset/SemanticKITTI/sequences
  args: {
          'componentOcclusion': True,
          'attenuation': True,
          'scatterNoise': True,
  }
  num_points: 80000
  voxel_size: 0.05

tgt_dataset:
  name: semanticstf
  root: /home/dataset/SemanticSTF
  num_points: 80000
  voxel_size: 0.05

num_epochs: 50
batch_size: 8

criterion:
  name: cross_entropy
  ignore_index: 255

optimizer:
  name: sgd
  lr: 2.4e-1
  weight_decay: 1.0e-4
  momentum: 0.9
  nesterov: true

scheduler:
  name: cosine_warmup


workers_per_gpu: 8
distributed: False
amp_enabled: True
