model:
  name: minkunet_learner
  cr: 0.5
  lamda_ct: 0.15
  lamda_sc: 0.1
  lamda_snc: 0.1
  k_snc: 8
  gamma_acp: 12
  r_median: 0.0  # 自动计算


data:
  num_classes: 19
  ignore_label: 255
  training_size: 19132

train:
  seed: 1588147245
  deterministic: False

src_dataset:
  name: semantickitti   # pointdr原始的数据处理方式
  root: /home/dataset/SemanticKITTI/sequences
  num_points: 80000
  voxel_size: 0.05

tgt_dataset:
  name: semanticstf
  root: /home/dataset/SemanticSTF
  num_points: 80000
  voxel_size: 0.05

num_epochs: 50
batch_size: 8

criterion:
  name: cross_entropy
  ignore_index: 255

optimizer:
  name: sgd
  lr: 2.4e-1
  weight_decay: 1.0e-4
  momentum: 0.9
  nesterov: true

scheduler:
  name: cosine_warmup


workers_per_gpu: 8
distributed: True
amp_enabled: True
